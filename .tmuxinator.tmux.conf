set-option -g status on
set-option -g status-position bottom
set-option -g status-interval 5
set-option -g status-left-length 48
set-option -g status-right-length 80
set-option -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set-option -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=#1e1e2e,fg=#89b4fa] "
set-option -g status-right "#[bg=#313244,fg=#cdd6f4] %H:%M #[bg=#89b4fa,fg=#11111b,bold] %d %b "

set-window-option -g window-status-separator ""
set-window-option -g window-status-format "#[bg=#313244,fg=#cdd6f4] #I:#W#{?window_flags,#{window_flags},} "
set-window-option -g window-status-current-format "#[bg=#cba6f7,fg=#11111b,bold] ACTIVE #I:#W#{?window_flags,#{window_flags},} "

set-window-option -g pane-border-status top
set-window-option -g pane-border-format "#{?pane_active,#[bg=#89b4fa,fg=#11111b,bold],#[bg=#313244,fg=#a6adc8]} #T "
set-window-option -g pane-border-style "fg=#45475a"
set-window-option -g pane-active-border-style "fg=#89b4fa"

set-option -g message-style "bg=#89b4fa,fg=#11111b,bold"
set-option -g mode-style "bg=#89b4fa,fg=#11111b,bold"
