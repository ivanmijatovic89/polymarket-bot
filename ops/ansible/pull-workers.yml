---
- name: Pull code on backtest workers and restart them onto it
  hosts: backtest_workers
  gather_facts: false
  ignore_unreachable: true
  vars:
    backtest_worker_session_default: polymarket-backtest-worker
    backtest_worker_command_default: ./scripts/run-worker.sh --queues markets
    backtest_worker_shell_default: /bin/zsh
    pull_drain_seconds_default: 120

  tasks:
    - name: Resolve settings
      ansible.builtin.set_fact:
        worker_repo_dir: '{{ backtest_repo_dir | mandatory }}'
        worker_session: '{{ backtest_worker_session | default(backtest_worker_session_default) }}'
        worker_command: '{{ backtest_worker_command | default(backtest_worker_command_default) }}'
        worker_shell: '{{ backtest_worker_shell | default(backtest_worker_shell_default) }}'
        worker_log_dir: '{{ backtest_worker_log_dir | default((backtest_repo_dir | mandatory) ~ "/logs/workers") }}'
        drain_seconds: '{{ pull_drain_seconds | default(pull_drain_seconds_default) | int }}'

    # Everything in ONE remote shell: each ansible task costs an SSH round
    # trip, and the slowest (overseas) host pays for all of them — that is why
    # the multi-task fleet:update takes ~50s while this stays in seconds.
    - name: Pull, drain and restart
      ansible.builtin.shell:
        cmd: |
          set -u
          t0=$(date +%s)
          cd {{ worker_repo_dir | quote }}
          remote={{ backtest_remote | default('origin') | quote }}
          want={{ pull_branch | default('') | quote }}
          session={{ worker_session | quote }}
          log_dir={{ worker_log_dir | quote }}
          drain={{ drain_seconds }}

          tmux_bin="$(command -v tmux || true)"
          for c in /opt/homebrew/bin/tmux /usr/local/bin/tmux /usr/bin/tmux; do
            [ -n "$tmux_bin" ] && break
            [ -x "$c" ] && tmux_bin="$c"
          done

          err=/tmp/fleet-pull-err.$$
          # Emit the one-line summary, then a DETAIL: block for anything that
          # went wrong, so an unexpected failure carries its reason instead of
          # a bare marker (git stderr, npm tail, or the worker log on a failed
          # restart). The recap parses line 1 for fields and shows DETAIL as-is.
          fail() { echo "$1 $before ? skipped none $2 $(( $(date +%s) - t0 ))"; echo "DETAIL: $3"; exit 0; }

          before="$(git rev-parse --short HEAD)"
          lock_before="$(git rev-parse HEAD:package-lock.json 2>/dev/null || echo none)"

          git fetch --prune "$remote" >"$err" 2>&1 || fail FETCH_FAILED - "$(tail -3 "$err")"
          branch="$(git rev-parse --abbrev-ref HEAD)"
          if [ -n "$want" ] && [ "$want" != "$branch" ]; then
            # Never reset an existing local branch (it may hold unpushed work).
            if git rev-parse --verify --quiet "refs/heads/$want" >/dev/null; then
              git checkout "$want" >"$err" 2>&1 || fail CHECKOUT_FAILED - "$(tail -3 "$err")"
            else
              git checkout --track "$remote/$want" >"$err" 2>&1 || fail CHECKOUT_FAILED - "$(tail -3 "$err")"
            fi
            branch="$want"
          fi
          git merge --ff-only "$remote/$branch" >"$err" 2>&1 || fail MERGE_FAILED - "$(tail -3 "$err")"
          after="$(git rev-parse --short HEAD)"
          lock_after="$(git rev-parse HEAD:package-lock.json 2>/dev/null || echo none)"

          deps=skipped
          if [ "$lock_before" != "$lock_after" ]; then
            npm install >"$err" 2>&1 && deps=installed || deps=FAILED
          fi

          # Restart only what was actually running, and only when the code moved.
          worker_state=none
          if [ -n "$tmux_bin" ] && "$tmux_bin" has-session -t "$session" 2>/dev/null; then
            worker_state=managed
          elif pgrep -f 'cli/backtestWorker[.]ts' >/dev/null 2>&1; then
            worker_state=unmanaged
          fi

          restarted=no
          if [ "$before" != "$after" ] && [ "$worker_state" != none ]; then
            if [ "$worker_state" = managed ]; then
              "$tmux_bin" send-keys -t "$session" C-c
            else
              pgrep -f 'cli/backtestWorker[.]ts' | while read -r pid; do
                [ "$(ps -o comm= -p "$pid" 2>/dev/null | sed 's:.*/::')" = node ] && kill -TERM "$pid"
              done
            fi
            waited=0
            while [ "$waited" -lt "$drain" ]; do
              alive=no
              if [ "$worker_state" = managed ]; then
                "$tmux_bin" has-session -t "$session" 2>/dev/null && alive=yes
              else
                pgrep -f 'cli/backtestWorker[.]ts' >/dev/null 2>&1 && alive=yes
              fi
              [ "$alive" = no ] && break
              sleep 2
              waited=$((waited + 2))
            done
            if [ "$alive" = yes ]; then
              restarted=DRAIN_TIMEOUT
            else
              mkdir -p "$log_dir"
              worker_log="$log_dir/$session.log"
              "$tmux_bin" new-session -d -s "$session" -c {{ worker_repo_dir | quote }} \
                {{ ("exec " ~ worker_shell ~ " -lic " ~ ("exec " ~ worker_command ~ " >> " ~ worker_log_dir ~ "/" ~ worker_session ~ ".log 2>&1") | quote) | quote }}
              sleep 2
              if "$tmux_bin" has-session -t "$session" 2>/dev/null; then
                restarted=yes
              else
                restarted=START_FAILED
                start_detail="$(tail -6 "$worker_log" 2>/dev/null | tr '\n' '|')"
              fi
            fi
          fi

          echo "$branch $before $after $deps $worker_state $restarted $(( $(date +%s) - t0 ))"
          [ "$restarted" = START_FAILED ] && echo "DETAIL: worker log — ${start_detail:-<empty>}"
          [ "$deps" = FAILED ] && echo "DETAIL: npm install — $(tail -3 "$err" 2>/dev/null | tr '\n' '|')"
          rm -f "$err"
      register: pull_result
      failed_when: false
      changed_when: pull_result.rc == 0 and (pull_result.stdout.split()[1] | default('')) != (pull_result.stdout.split()[2] | default(''))

    - name: Write recap file
      run_once: true
      delegate_to: localhost
      ansible.builtin.copy:
        dest: /tmp/fleet-pull-summary.txt
        mode: '0644'
        content: |-

          ================ FLEET PULL ================
          {% for h in ansible_play_hosts_all %}
          {% set r = hostvars[h].pull_result | default(none) %}
          {% if r is none or r.rc is not defined %}
          {{ h }}  ⚠️  unreachable
          {% elif r.rc != 0 %}
          {{ h }}  🔴 failed: {{ (r.stdout | default('') | trim) }} {{ (r.stderr | default('') | trim)[:100] }}
          {% else %}
          {% set p = (r.stdout_lines[0] | default('')).split() %}
          {% set bad = ['START_FAILED', 'DRAIN_TIMEOUT', 'FETCH_FAILED', 'CHECKOUT_FAILED', 'MERGE_FAILED', 'FAILED'] %}
          {% set icon = '🔴' if p[0] | default('') in bad or p[5] | default('') in bad or p[3] | default('') == 'FAILED' else '✅' %}
          {{ h }}  {{ icon }} {{ '%5s' | format((p[6] | default('?')) ~ 's') }}  {{ p[0] | default('?') }}  {{ p[1] | default('?') }} → {{ p[2] | default('?') }}{{ '  (already current)' if p[1] | default('') == p[2] | default('x') else '' }}{{ '  deps:' ~ p[3] if p[3] | default('skipped') != 'skipped' else '' }}  worker:{{ 'restarted' if p[5] | default('') == 'yes' else (p[5] if p[5] | default('no') != 'no' else ('running, code unchanged' if p[4] | default('none') != 'none' else 'not running')) }}
          {% for d in r.stdout_lines[1:] if d.startswith('DETAIL:') %}
                {{ d }}
          {% endfor %}
          {% endif %}
          {% endfor %}
