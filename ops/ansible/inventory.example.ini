[backtest_workers]
# Local smoke-test target. Copy this file to inventory.ini and replace/add
# remote worker hosts when you are ready to update the real fleet.
localhost ansible_connection=local backtest_repo_dir=/Users/YOUR_USER/Sites/polymarket-bot

# Remote examples:
# worker-1 ansible_host=worker-1-ansible backtest_repo_dir=/Users/worker-1/Sites/polymarket-bot
# worker-2 ansible_host=100.64.0.25 backtest_repo_dir=/Users/worker-2/Sites/polymarket-bot backtest_worker_command="./scripts/run-worker.sh --queues markets"  # --market-concurrency defaults to machines.json cores_for_backtest (else cores-2)

# The producer (main device) — included in fleet:status as the reference
# machine; workers' dataset gaps are shown relative to it.
[producer]
# ivan-mbp ansible_connection=local backtest_repo_dir=/Users/YOUR_USER/Sites/polymarket-bot
