---
- name: Report Global Runtime daemon status (read-only)
  hosts: producer:backtest_workers
  gather_facts: false
  # Offline machines are a status finding, not an error.
  ignore_unreachable: true
  vars:
    global_runtime_shell_default: /bin/zsh

  tasks:
    - name: Skip machines without a Global Runtime daemon
      ansible.builtin.meta: end_host
      when: not (global_runtime_enabled | default(false) | bool)

    - name: Push status probe
      # Into the repo's own gitignored scratch dir rather than a predictable
      # /tmp path — sandboxed mission sessions can write /tmp.
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../scripts/global-runtime-status-probe.mjs'
        dest: '{{ backtest_repo_dir | mandatory }}/logs/global-runtime-status-probe.mjs'
        mode: '0644'

    - name: Run status probe
      # Interactive login shell (-lic) so nvm-installed node is on PATH.
      ansible.builtin.command:
        argv:
          - '{{ global_runtime_shell | default(global_runtime_shell_default) }}'
          - '-lic'
          - 'cd {{ backtest_repo_dir | mandatory | quote }} && node logs/global-runtime-status-probe.mjs'
      register: probe
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Parse probe output
      ansible.builtin.set_fact:
        global_runtime_status: '{{ probe.stdout_lines | last | from_json }}'
      when: probe.rc | default(1) == 0 and (probe.stdout_lines | default([]) | length) > 0

    - name: Show status
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          session={{ (global_runtime_status.session.alive | default(false)) | ternary('alive', 'DOWN') }}
          health={{ (global_runtime_status.health.ok | default(false)) | ternary('ok', 'UNREACHABLE') }}
          branch={{ global_runtime_status.git.branch | default('?') }}@{{ global_runtime_status.git.sha | default('?') }}
      when: global_runtime_status is defined

    - name: Show probe failure
      ansible.builtin.debug:
        msg: '{{ inventory_hostname }}: PROBE FAILED rc={{ probe.rc | default("?") }} stderr={{ (probe.stderr | default(""))[:300] }}'
      when: global_runtime_status is not defined
