---
- name: Report fleet status (read-only)
  hosts: backtest_workers
  gather_facts: false
  # Keep unreachable hosts in the play result instead of aborting — an
  # offline machine is a status finding, not an error.
  ignore_unreachable: true
  vars:
    backtest_worker_shell_default: /bin/zsh

  tasks:
    - name: Resolve status settings
      ansible.builtin.set_fact:
        worker_repo_dir: '{{ backtest_repo_dir | mandatory }}'
        worker_shell: '{{ backtest_worker_shell | default(backtest_worker_shell_default) }}'

    - name: Push status probe
      # Copied from the control machine so status works even on machines
      # whose repo checkout is outdated or dirty.
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../scripts/fleet-status-probe.mjs'
        dest: /tmp/fleet-status-probe.mjs
        mode: '0644'

    - name: Run status probe
      # Interactive login shell (-lic) so nvm-installed node is on PATH —
      # nvm init typically lives in .zshrc. cwd must be the repo root (the
      # probe inspects it). A probe failure is a status finding, not a
      # playbook error.
      ansible.builtin.command:
        argv:
          - '{{ worker_shell }}'
          - '-lic'
          - 'cd {{ worker_repo_dir | quote }} && node /tmp/fleet-status-probe.mjs'
      register: probe
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Parse probe output
      ansible.builtin.set_fact:
        fleet_status: '{{ probe.stdout_lines | last | from_json }}'
      when: probe.rc | default(1) == 0 and (probe.stdout_lines | default([]) | length) > 0

    - name: Show probe failure
      ansible.builtin.debug:
        msg: '{{ inventory_hostname }}: PROBE FAILED rc={{ probe.rc | default("?") }} stderr={{ (probe.stderr | default(""))[:300] }}'
      when: fleet_status is not defined

- name: Fleet status recap
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Write recap file
      ansible.builtin.copy:
        dest: /tmp/fleet-status-summary.txt
        mode: '0644'
        content: |-

          ================ FLEET STATUS ================
          {% for h in groups['backtest_workers'] %}
          {% set st = hostvars[h].fleet_status | default(none) %}
          {% if st is none %}
          {{ h }}  ✗ UNREACHABLE or probe failed
          {% else %}
          {{ h }}  {{ st.git.branch }}@{{ st.git.commit }}{{ ' DIRTY' if st.git.dirty else '' }} · {{ st.cores }} cores · {{ st.diskFreeGb }}GB free · worker {{ 'UP(' ~ st.sessions.backtestWorker.panes ~ ')' if st.sessions.backtestWorker.alive else 'down' }} · converter {{ 'UP(' ~ st.sessions.telonexConverter.panes ~ ')' if st.sessions.telonexConverter.alive else 'down' }}
          {% for k, v in st.datasets.converted.items() %}
              converted {{ '%-8s' | format(k) }} {{ '%7d' | format(v.files) }} files   newest {{ '%Y-%m-%d %H:%M' | strftime(v.newest.split('-')[-1].split('.')[0] | int) if v.newest else '—' }}
          {% endfor %}
          {% if st.datasets.converted | length == 0 %}
              converted          — none —
          {% endif %}
          {% for k, v in st.datasets.binanceAggTrades.items() %}
              binance   {{ '%-8s' | format(k) }} {{ '%7d' | format(v.files) }} days    newest {{ v.newest[-18:-8] if v.newest else '—' }}
          {% endfor %}
          {% if st.datasets.binanceAggTrades | length == 0 %}
              binance            — none —
          {% endif %}
          {% for k, v in st.datasets.cryptoPrices.items() %}
              chainlink {{ '%-8s' | format(k) }} {{ '%7d' | format(v.files) }} days    newest {{ v.newest[-18:-8] if v.newest else '—' }}
          {% endfor %}
          {% if st.datasets.cryptoPrices | length == 0 %}
              chainlink          — none —
          {% endif %}
          {% endif %}
          {% endfor %}
