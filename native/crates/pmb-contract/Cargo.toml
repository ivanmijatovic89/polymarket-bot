[package]
name = "pmb-contract"
description = "TS<->Rust contract: EngineJob, ModelConfig, EngineResult, closed vocabularies, JSON Schema export (21-job-and-output-contract.md). No engine dependencies."
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
# `raw_value` renders output money as exact JSON number tokens (21 §18 N5)
# without going through f64.
serde_json = { workspace = true, features = ["raw_value"] }
schemars.workspace = true
sha2.workspace = true

[lints]
workspace = true
