[package]
name = "pmb-sdk"
description = "Strategy SDK (30-strategy-sdk.md): the curated prelude, params runtime (Params, ParamEnum, ParamError), intent meta and the value macros. The only crate a strategy depends on (P1)."
edition.workspace = true
# Versioned independently of the engine (30 §2); embedded as SDK_VERSION.
version = "0.1.0"
publish.workspace = true
rust-version.workspace = true

[dependencies]
libm.workspace = true
pmb-core.workspace = true
# The engine surface the prelude re-exports by name (30 §3, P1): Strategy,
# Ctx and its views, Intents, account events.
pmb-engine.workspace = true
# Feed and plugin configs of `Requirements` (30 §10), re-exported by name.
pmb-feeds.workspace = true
pmb-plugins = { path = "../pmb-plugins" }
# `strategy_main!` (30 §4 rule 1) and the params seam (30 §9, 20 §5.1);
# the testkit runs jobs through its real `run` pipeline (30 §15).
pmb-runtime = { path = "../pmb-runtime" }
pmb-sdk-macros.workspace = true
serde.workspace = true
# `raw_value` keeps the exact text of JSON numbers so fixed-point params are
# parsed from decimal text, never through f64 (30 §9, 10 §2 T6).
serde_json = { workspace = true, features = ["raw_value"] }

# 30 §15: the testkit is a dev-dependency feature of strategy packages
# (31 §2.2); it needs the job contract types to drive the real engine.
[features]
testkit = ["dep:pmb-contract"]

[dependencies.pmb-contract]
workspace = true
optional = true

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
# Digests of the TS round_dp golden (tests/fixtures/round_dp_gen.ts).
sha2.workspace = true
