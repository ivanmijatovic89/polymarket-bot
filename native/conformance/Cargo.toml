[package]
name = "pmb-conformance"
version = "0.1.0"
edition = "2021"
publish = false
description = "Independent spec-conformance tests for the native engine (60-verification.md §10, D45)"
license = "UNLICENSED"

[lib]
# Pure helpers shared by the test files: vector loading, SHA-256, the RNG-5
# derivation, exact decimal arithmetic and civil-date epochs. Written from the
# spec only; none of it comes from the engine crates (CF-2).
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# C2 (60 §10.0): the tests bind to the real SDK and its testkit (30 §15)
# through the public API only. Nothing else is allowed here (30 P1, D16).
pmb-sdk = { path = "../crates/pmb-sdk", features = ["testkit"] }

# This crate stays OUT of the engine workspace: its own `[workspace]` table
# makes it a root, `.cargo/config.toml` keeps its build under
# native/conformance/target, and Cargo.lock is the engine lock pruned offline
# (no crate that is not in native/Cargo.lock). Run with
# `cargo test --manifest-path native/conformance/Cargo.toml` (CF-2).
[workspace]
