[package]
name = "polymarket-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
parquet = { version = "=56.2.0", default-features = false, features = ["snap", "flate2-rust_backened", "zstd", "lz4"] }
thrift = { version = "=0.17.0", default-features = false }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.141", features = ["float_roundtrip", "preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[profile.release]
lto = "thin"
codegen-units = 1
