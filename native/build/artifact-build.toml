# Engine-owned build policy for every strategy build (31 §4.1, §4.2).
#
# This is a TEMPLATE. The builder (src/strategy/artifacts/native/) renders it
# by replacing every {{NAME}} placeholder with a host value and passes the
# rendered file to cargo as `--config <file>`:
#
#   cargo build --locked --offline --profile <profile> --bin <bin> \
#     --config <rendered artifact-build.toml>
#
# The rendered file holds all profiles and is byte-identical for every command
# on one host, so no command invalidates another's cache (31 §4.1). The
# source hash (31 §5.2) records the sha256 of this UNRENDERED file, and every
# file under native/build/ is part of the engine source set (31 §5.3).
#
# Placeholders (all filled by the builder; an unknown or unfilled placeholder
# is an error):
#   CARGO_HOME, RUSTUP_HOME     absolute host paths (env, else ~/.cargo, ~/.rustup)
#   ENGINE_ROOT                 the engine checkout (repository root holding native/)
#   ENGINE_ROOT_REALPATH        its realpath
#   TARGET_DIR                  the host's shared target directory (31 §4.5)
#   PMB_ENGINE_SOURCE_HASH      31 §5.3
#   PMB_ENGINE_COMMIT           31 §5.3
#   PMB_ENGINE_DIRTY            true | false (31 §5.3)
#   PMB_RUSTC                   rustc release, e.g. 1.89.0
#
# The binary learns its own profile name from PMB_BUILD_PROFILE, which the
# builder sets on the cargo process (not here, so the rendered file stays the
# same for every profile).

[build]
target = "aarch64-apple-darwin"

# D18, literally; local checks only (strategy:check gates 4-7, the build
# daemon's `check`). Never published (31 §4.1).
[profile.iterate]
inherits = "release"
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
overflow-checks = true
debug = false
strip = "symbols"
incremental = false

# Published, fleet, live. Provisional content until the M5a measurement of
# 31 §4.6 / 16 §11.2 chooses it (amended D18).
[profile.artifact]
inherits = "iterate"
lto = "thin"
codegen-units = 1

# 60 §8.1: artifact plus debug assertions; local cache only, never published.
[profile.parity-check]
inherits = "artifact"
debug-assertions = true

# 16 BP-4: flamegraphs only; never published.
[profile.profiling]
inherits = "artifact"
debug = "line-tables-only"
strip = false

# `force = true`: a value inherited from the caller's environment can never
# replace these (00 R14, 31 §4.2 "no environment read may embed ...").
[env]
MACOSX_DEPLOYMENT_TARGET = { value = "11.0", force = true } # MUST NOT exceed the oldest fleet macOS
PMB_ENGINE_SOURCE_HASH = { value = "{{PMB_ENGINE_SOURCE_HASH}}", force = true }
PMB_ENGINE_COMMIT = { value = "{{PMB_ENGINE_COMMIT}}", force = true }
PMB_ENGINE_DIRTY = { value = "{{PMB_ENGINE_DIRTY}}", force = true }
PMB_RUSTC = { value = "{{PMB_RUSTC}}", force = true }

# target-cpu stays the target default (Apple M1 class); `target-cpu=native`
# is forbidden (31 §4.2, 16 BP-1).
[target.aarch64-apple-darwin]
rustflags = [
  "--remap-path-prefix={{CARGO_HOME}}=/cargo",
  "--remap-path-prefix={{RUSTUP_HOME}}=/rustup",
  "--remap-path-prefix={{ENGINE_ROOT}}=/pmb/engine",
  "--remap-path-prefix={{ENGINE_ROOT_REALPATH}}=/pmb/engine",
  # D-PENDING: 31 §4.2 lists four remaps; build-script outputs (OUT_DIR) live
  # in the shared target directory, which sits under the home directory, so a
  # crate that include!s generated code would leak it. Chose: a fifth,
  # host-stable remap of the target directory.
  "--remap-path-prefix={{TARGET_DIR}}=/pmb/target",
  # D-PENDING: 31 §4.2 does not list linker flags. ld64 computes LC_UUID
  # before the strip, over a debug map whose N_OSO entries name the object
  # files by absolute path in the target directory; the UUID then depends on
  # the LENGTH of the target-directory path (measured on worker-1: same
  # sources, target dirs of different lengths, different sha256), so hosts
  # with different home directories would build different bytes. Chose:
  # -oso_prefix makes those entries relative to the target directory.
  "-Clink-arg=-Wl,-oso_prefix,{{TARGET_DIR}}/",
]
