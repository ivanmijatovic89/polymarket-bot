# Engine-owned clippy configuration for strategy packages (30 §11, 31 §7.1
# gate 3). `strategy:check` and every publish set
#   CLIPPY_CONF_DIR=<engine>/native/build/clippy
# and pass the determinism lints with `-F` (forbid), so neither a repository
# clippy.toml nor an in-source `#[allow]` can weaken them:
#   -F clippy::disallowed_types -F clippy::disallowed_methods
#   -F clippy::disallowed_macros -F clippy::print_stdout
#   -F clippy::print_stderr -F clippy::dbg_macro
#
# Lints are a convention guard, not a security boundary; the behavioral
# proofs are the group-equivalence smoke and the interests A/B (30 §11).
# Engine crates are not linted with this file: it applies to strategy
# packages only (path dependencies such as pmb-sdk are not workspace members
# of a strategy package, so clippy does not lint them).

disallowed-types = [
  # Randomized hashing: use pmb_sdk::collections::{Map, Set, DetHashMap, DetHashSet}.
  { path = "std::collections::HashMap", reason = "RandomState iteration order; use pmb_sdk::collections (30 §11)" },
  { path = "std::collections::HashSet", reason = "RandomState iteration order; use pmb_sdk::collections (30 §11)" },
  { path = "std::hash::RandomState", reason = "randomized hashing (30 §11)" },
  { path = "std::collections::hash_map::RandomState", reason = "randomized hashing (30 §11)" },
  # Threads and synchronization: a strategy instance is single-threaded.
  { path = "std::sync::Mutex", reason = "no sync primitives in strategies (30 §11)" },
  { path = "std::sync::RwLock", reason = "no sync primitives in strategies (30 §11)" },
  { path = "std::sync::Condvar", reason = "no sync primitives in strategies (30 §11)" },
  { path = "std::sync::Barrier", reason = "no sync primitives in strategies (30 §11)" },
  { path = "std::sync::Once", reason = "no global state in strategies (30 §11)" },
  { path = "std::sync::OnceLock", reason = "no global state in strategies (30 §11)" },
  { path = "std::sync::LazyLock", reason = "no global state in strategies (30 §11)" },
  { path = "std::sync::atomic::AtomicBool", reason = "no atomics in strategies (30 §11)" },
  { path = "std::sync::atomic::AtomicI8", reason = "no atomics in strategies (30 §11)" },
  { path = "std::sync::atomic::AtomicI16", reason = "no atomics in strategies (30 §11)" },
  { path = "std::sync::atomic::AtomicI32", reason = "no atomics in strategies (30 §11)" },
  { path = "std::sync::atomic::AtomicI64", reason = "no atomics in strategies (30 §11)" },
  { path = "std::sync::atomic::AtomicIsize", reason = "no atomics in strategies (30 §11)" },
  { path = "std::sync::atomic::AtomicU8", reason = "no atomics in strategies (30 §11)" },
  { path = "std::sync::atomic::AtomicU16", reason = "no atomics in strategies (30 §11)" },
  { path = "std::sync::atomic::AtomicU32", reason = "no atomics in strategies (30 §11)" },
  { path = "std::sync::atomic::AtomicU64", reason = "no atomics in strategies (30 §11)" },
  { path = "std::sync::atomic::AtomicUsize", reason = "no atomics in strategies (30 §11)" },
  { path = "std::sync::atomic::AtomicPtr", reason = "no atomics in strategies (30 §11)" },
  { path = "std::sync::mpsc::Sender", reason = "no threads in strategies (30 §11)" },
  { path = "std::sync::mpsc::Receiver", reason = "no threads in strategies (30 §11)" },
  { path = "std::thread::JoinHandle", reason = "no threads in strategies (30 §11)" },
  { path = "std::thread::Builder", reason = "no threads in strategies (30 §11)" },
  # Wall clock: use ctx.now().
  { path = "std::time::SystemTime", reason = "no wall clock; use ctx.now() (30 §11)" },
  { path = "std::time::Instant", reason = "no wall clock; use ctx.now() (30 §11)" },
  # Filesystem, network, processes: params and Requirements only.
  { path = "std::fs::File", reason = "no filesystem access in strategies (30 §11)" },
  { path = "std::fs::OpenOptions", reason = "no filesystem access in strategies (30 §11)" },
  { path = "std::fs::ReadDir", reason = "no filesystem access in strategies (30 §11)" },
  { path = "std::net::TcpStream", reason = "no network access in strategies (30 §11)" },
  { path = "std::net::TcpListener", reason = "no network access in strategies (30 §11)" },
  { path = "std::net::UdpSocket", reason = "no network access in strategies (30 §11)" },
  { path = "std::process::Command", reason = "no processes in strategies (30 §11)" },
  { path = "std::process::Child", reason = "no processes in strategies (30 §11)" },
  { path = "std::fs::DirBuilder", reason = "no filesystem access in strategies (30 §11)" },
  { path = "std::os::unix::net::UnixStream", reason = "no IPC in strategies (30 §11)" },
  { path = "std::os::unix::net::UnixListener", reason = "no IPC in strategies (30 §11)" },
  { path = "std::os::unix::net::UnixDatagram", reason = "no IPC in strategies (30 §11)" },
  # Standard streams: stdout carries protocol JSON (20 G1); use the logging macros (30 §13).
  { path = "std::io::Stdin", reason = "no standard streams in strategies (30 §11, 20 G1)" },
  { path = "std::io::Stdout", reason = "no standard streams in strategies (30 §11, 20 G1)" },
  { path = "std::io::Stderr", reason = "no standard streams in strategies (30 §11, 20 G1)" },
]

