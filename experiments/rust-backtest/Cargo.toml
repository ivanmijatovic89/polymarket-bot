[package]
name = "rust-backtest-experiment"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "=1.0.98"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
flate2 = "=1.1.2"
parquet = { version = "=56.2.0", default-features = false, features = ["snap", "flate2-rust_backened", "zstd", "lz4"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.141", features = ["float_roundtrip", "preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
