name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-quality:
    name: Root (Prettier + Typecheck + ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run code:prettier:check

      - name: Typecheck + ESLint
        run: npm run code:typecheck-eslint

  webui-quality:
    name: WebUI (Typecheck + Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        run: npm ci
        working-directory: webui

      - name: WebUI typecheck
        run: npm run code:typecheck
        working-directory: webui

      - name: WebUI build
        run: npm run build
        working-directory: webui

  docs-quality:
    name: Docs (VitePress Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm install
        working-directory: docs

      - name: Build docs
        run: npm run build
        working-directory: docs

  dashboard-quality:
    name: Dashboard (Typecheck + Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # Dashboard is an npm workspace now; the lockfile lives at the
          # repo root and hoists @polymarket-bot/stats + dashboard's deps.
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        # Install from the repo root so npm wires the workspace symlinks
        # (root node_modules/@polymarket-bot/stats → src/backtest/stats).
        run: npm ci

      - name: Dashboard typecheck
        run: npm run dashboard:typecheck

      - name: Dashboard build
        run: npm run dashboard:build
        env:
          # Build doesn't need real DB/Redis; just needs the vars to exist
          # so next.config.ts + lib/db.ts don't throw at boot.
          DATABASE_NAME: ci_placeholder
          REDIS_URL: redis://localhost:6379
