name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main
    # Protocol shifts (protocols/README.md) push journal/strategy commits
    # straight to main continuously; skip the full quality matrix for those.
    # Compile/lint health of protocol strategies is the shift's own pre-push
    # check (`npm run protocol:check -- <name>`) — the registry loads them
    # fail-soft, so there is deliberately no CI gate. PRs are unfiltered —
    # required status checks must always run there.
    paths-ignore:
      - 'protocols/**'

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-quality:
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: recorder_v4_catalog_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=12
    name: Root (Prettier + Typecheck + ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run code:prettier:check

      - name: Typecheck + ESLint
        run: npm run code:typecheck-eslint

      - name: Global Runtime tests
        run: npm run global-runtime:test

      - name: Strategy artifact tests
        run: npm run artifacts:test

      - name: Trading tests
        run: npm run trading:test

      - name: Feed coverage tests
        run: npm run feeds:coverage:test

      - name: Research dataset tests
        run: npm run research:data:test

      - name: Recorder v4 tests
        run: npm run record:v4:test

      - name: Recorder V4 MySQL catalog integration
        run: node --import tsx --test src/recorder-v4/catalog/mysql.integration.test.ts
        env:
          CATALOG_TEST_MYSQL: '1'
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: '3306'
          DATABASE_USERNAME: root
          DATABASE_PASSWORD: ''
          DATABASE_NAME: recorder_v4_catalog_test

      - name: Install zsh for mocked macOS service tests
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Recorder service log and guarded update tests
        run: node --test scripts/tests/bounded-log.test.mjs scripts/tests/recorder-service-update.test.mjs scripts/tests/catalog-service.test.mjs scripts/tests/catalog-recovery.test.mjs

      - name: Research protocol check
        run: npm run research:check

      - name: Research index freshness
        run: npm run research:build-index -- --check

  webui-quality:
    name: WebUI (Typecheck + Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        run: npm ci
        working-directory: webui

      - name: WebUI typecheck
        run: npm run code:typecheck
        working-directory: webui

      - name: WebUI build
        run: npm run build
        working-directory: webui

  docs-quality:
    name: Docs (VitePress Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm install
        working-directory: docs

      - name: Build docs
        run: npm run build
        working-directory: docs

  dashboard-quality:
    name: Dashboard (Typecheck + Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # Dashboard is an npm workspace now; the lockfile lives at the
          # repo root and hoists @polymarket-bot/stats + dashboard's deps.
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        # Install from the repo root so npm wires the workspace symlinks
        # (root node_modules/@polymarket-bot/stats → src/backtest/stats).
        run: npm ci

      - name: Dashboard typecheck
        run: npm run dashboard:typecheck

      - name: Dashboard tests
        run: npm run dashboard:test

      - name: Dashboard build
        run: npm run dashboard:build
        env:
          # Build doesn't need real DB/Redis; just needs the vars to exist
          # so next.config.ts + lib/db.ts don't throw at boot.
          DATABASE_NAME: ci_placeholder
          REDIS_URL: redis://localhost:6379

  native-quality:
    name: Native Rust engine (fmt + clippy + test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
          rustup default 1.89.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}

      - name: Engine workspace (fmt, clippy, test)
        working-directory: native
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Strategy package (fmt, clippy, test)
        if: hashFiles('native/strategies/Cargo.toml') != ''
        working-directory: native/strategies
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
