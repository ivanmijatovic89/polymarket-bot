name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main
    # Protocol shifts (protocols/README.md) push journal/strategy commits
    # straight to main continuously; skip the full quality matrix for those.
    # Compile/lint health of protocol strategies is the shift's own pre-push
    # check (`npm run protocol:check -- <name>`) — the registry loads them
    # fail-soft, so there is deliberately no CI gate. PRs are unfiltered —
    # required status checks must always run there.
    paths-ignore:
      - 'protocols/**'

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-quality:
    name: Root (Prettier + Typecheck + ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run code:prettier:check

      - name: Typecheck + ESLint
        run: npm run code:typecheck-eslint

      - name: Global Runtime tests
        run: npm run global-runtime:test

      - name: Strategy artifact tests
        run: npm run artifacts:test

      - name: Trading tests
        run: npm run trading:test

      - name: Feed coverage tests
        run: npm run feeds:coverage:test

      - name: Research dataset tests
        run: npm run research:data:test

      - name: Recorder v4 tests
        run: npm run record:v4:test

      - name: Install zsh for mocked macOS service tests
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Recorder service log and guarded update tests
        run: node --test scripts/tests/bounded-log.test.mjs scripts/tests/recorder-service-update.test.mjs

      - name: Research protocol check
        run: npm run research:check

      - name: Research index freshness
        run: npm run research:build-index -- --check

  native-quality:
    name: Native runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      RUSTUP_TOOLCHAIN: '1.89.0'
    steps:
      - name: Checkout pinned reference history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Rust tooling
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy

      - name: Rust formatting
        run: cargo fmt --manifest-path native/trading-runtime/Cargo.toml -- --check

      - name: Rust lint
        run: cargo clippy --locked --manifest-path native/trading-runtime/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit tests and executable
        run: |
          cargo test --locked --manifest-path native/trading-runtime/Cargo.toml
          cargo build --locked --manifest-path native/trading-runtime/Cargo.toml

      - name: Native process lifecycle and contract tests
        run: node --import tsx --test src/runtime/nativeClient.test.ts src/runtime/nativeClient.integration.test.ts

      - name: Strategy and artifact inventory tests
        run: node --import tsx --test scripts/rust-migration/inventory-strategies.test.ts scripts/rust-migration/inventory-artifacts.test.ts

      - name: Full market and portfolio reference comparisons
        run: |
          python3 scripts/rust-migration/market-differential.py --node node
          python3 scripts/rust-migration/portfolio-differential.py --node node

      - name: Full intent risk and cancellation reference comparisons
        run: python3 scripts/rust-migration/intents-differential.py --node node

      - name: Debug and release mutable metadata reference comparisons
        run: |
          python3 scripts/rust-migration/metadata-differential.py --node node
          python3 scripts/rust-migration/metadata-differential.py --node node --release

      - name: Debug and release arithmetic and metric reference comparisons
        run: |
          python3 scripts/rust-migration/math-differential.py --node node
          python3 scripts/rust-migration/metrics-differential.py --node node
          python3 scripts/rust-migration/math-differential.py --node node --release
          python3 scripts/rust-migration/metrics-differential.py --node node --release

      - name: Strict TypeScript reference oracle checking
        run: node node_modules/typescript/bin/tsc --noEmit --module nodenext --moduleResolution nodenext --target ES2022 --strict --skipLibCheck scripts/rust-migration/*-oracle.mts

      - name: Debug and release typed callback admission reference comparisons
        run: |
          python3 scripts/rust-migration/dispatch-differential.py --node node
          python3 scripts/rust-migration/dispatch-differential.py --node node --release

      - name: Debug and release DECIMAL codec reference comparisons
        run: |
          python3 scripts/rust-migration/parquet-decimal-differential.py --node node
          python3 scripts/rust-migration/parquet-decimal-differential.py --node node --release

      - name: Debug and release actual local Parquet admission reference comparisons
        run: |
          python3 scripts/rust-migration/parquet-input-differential.py --node node
          python3 scripts/rust-migration/parquet-input-differential.py --node node --release

      - name: Full batch and calendar reference comparisons
        run: python3 scripts/rust-migration/stats-differential.py --node node

  webui-quality:
    name: WebUI (Typecheck + Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        run: npm ci
        working-directory: webui

      - name: WebUI typecheck
        run: npm run code:typecheck
        working-directory: webui

      - name: WebUI build
        run: npm run build
        working-directory: webui

  docs-quality:
    name: Docs (VitePress Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm install
        working-directory: docs

      - name: Build docs
        run: npm run build
        working-directory: docs

  dashboard-quality:
    name: Dashboard (Typecheck + Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # Dashboard is an npm workspace now; the lockfile lives at the
          # repo root and hoists @polymarket-bot/stats + dashboard's deps.
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        # Install from the repo root so npm wires the workspace symlinks
        # (root node_modules/@polymarket-bot/stats → src/backtest/stats).
        run: npm ci

      - name: Dashboard typecheck
        run: npm run dashboard:typecheck

      - name: Dashboard tests
        run: npm run dashboard:test

      - name: Dashboard build
        run: npm run dashboard:build
        env:
          # Build doesn't need real DB/Redis; just needs the vars to exist
          # so next.config.ts + lib/db.ts don't throw at boot.
          DATABASE_NAME: ci_placeholder
          REDIS_URL: redis://localhost:6379
