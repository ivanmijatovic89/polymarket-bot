name: Rust Backtest Experiment

on:
  pull_request:
    paths:
      - 'experiments/rust-backtest/**'
      - '.github/workflows/rust-backtest-experiment.yml'

jobs:
  experiment:
    name: Rust prototype and reference harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install pinned Rust tooling
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Rust formatting
        run: cargo +1.89.0 fmt --manifest-path experiments/rust-backtest/Cargo.toml -- --check
      - name: Rust lint
        run: cargo +1.89.0 clippy --locked --manifest-path experiments/rust-backtest/Cargo.toml --all-targets -- -D warnings
      - name: Rust deterministic safety tests
        run: cargo +1.89.0 test --locked --manifest-path experiments/rust-backtest/Cargo.toml
      - name: Reference harness typecheck
        run: node node_modules/typescript/bin/tsc -p experiments/rust-backtest/tsconfig.json
      - name: Python comparator and runner syntax
        run: python3 -m py_compile experiments/rust-backtest/benchmark.py experiments/rust-backtest/compare.py experiments/rust-backtest/scaling.py experiments/rust-backtest/raw-benchmark.py
