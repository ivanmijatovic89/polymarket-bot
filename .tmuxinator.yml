name: polymarket
root: .
tmux_options: -f /Users/mijat/Sites/polymarket-bot/.tmuxinator.tmux.conf
enable_pane_titles: true
pane_title_position: top
pane_title_format: '#{?pane_active,#[bg=#89b4fa,fg=#11111b,bold],#[bg=#313244,fg=#a6adc8]} #T '

on_project_start:
  - pgrep -x Tailscale >/dev/null || open -gja Tailscale
  - pgrep -x SwiftBar >/dev/null || open -gja SwiftBar

windows:
  - SERVICES:
      layout: tiled
      panes:
        - DASHBOARD: DASHBOARD_ALLOWED_DEV_ORIGINS=100.100.49.80,192.168.0.12 npm run dashboard
        - DOCUMENTATION: cd docs && npm run dev
        - BACKTEST WORKER: ./scripts/run-worker.sh --queues markets
        - GLOBAL RUNTIME: npm run global-runtime
